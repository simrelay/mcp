# PR + branch CI — no secrets, safe for fork PRs.
#
# Every change must pass this. Uses the committed null defaults in
# src/build-config.ts plus a dummy SIMRELAY_OAUTH_CLIENT_ID env, which is
# enough to typecheck, run all unit/integration tests, and verify the stdio
# MCP protocol against a mock SimRelay API.
#
# Real-flavor bundles (test/prod) are produced by build-mcpb.yml — those
# workflows use secrets but never run on fork PRs.
#
# Security notes:
#   * No untrusted user input (PR titles, issue bodies, etc.) is interpolated
#     into run: scripts. Only matrix.* and event triggers.
#   * No secrets used or referenced.

name: CI

on:
  pull_request:
  push:
    branches: ["**"]
    tags-ignore: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Run test suite
        env:
          SIMRELAY_OAUTH_CLIENT_ID: ci-dummy-client-id
        run: npm test

      - name: CLI smoke (help works)
        if: matrix.os != 'windows-latest'
        env:
          SIMRELAY_OAUTH_CLIENT_ID: ci-dummy-client-id
        run: node dist/index.js help
